
[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = true
fail-under = 100
exclude = [
  "setup.py",
  "docs",
  "build",
  "data",
  "bin",
  "dandelion/external",
  "tests",
]
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
verbose = 2
quiet = false
whitelist-regex = []
color = true

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
  "ignore::FutureWarning",
]
addopts = "--cov src/dandelion --cov-report=xml -rP"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["containter/*", "src/dandelion/external/*"]

[tool.pyright]
typeCheckingMode = "basic"

[build-system]
requires = ["hatchling", "hatch-vcs",]
build-backend = "hatchling.build"

[project]
name = "sc-dandelion"
dynamic = ["version"]
authors = [{ name = "zktuong", email = "z.tuong@uq.edu.au" }]
description = "sc-TCR/BCR-seq analysis tool"
readme = { file = "README.md", content-type = "text/markdown" }
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
keywords = ["dandelion", "single-cell", "immune", "TCR", "BCR"]
dependencies = [
  "airr",
  "setuptools_scm[toml]<9.2.3",
  "numpy<2.3.6",
  "pandas<2.3.4",
  "changeo<1.3.5",
  "anndata<0.12.7",
  "scanpy<1.11.6",
  "scikit-learn<1.7.3",
  "scipy<1.16.4",
  "numba<0.62.2",
  "seaborn<0.13.3",
  "networkx<3.7.0",
  "leidenalg<0.10.3",
  "polyleven<0.9.1",
  "h5py<3.15.2",
  "adjustText<1.3.1",
  "distance<0.1.4",
  "plotnine<0.15.2",
  "palettable<3.3.4",
  "mizani<0.13.2",
  "nxviz<0.7.7",
  "rich>=14.2.0",
  "typer>=0.20.0",
]

[project.urls]
homepage = "https://github.com/zktuong/dandelion/"
documentation = "https://sc-dandelion.readthedocs.io/"

[project.scripts]
dandelion_preprocess = "dandelion.__main__:ddl_typer"
# chango_clonotypes = "dandelion.changeo_clonotypes:main"

[project.optional-dependencies]
docs = [
  "airr<1.5.2",
  "ipykernel",
  "biopython<1.87",
  "changeo<1.3.5",
  "presto<0.7.7",
  "pyyaml",
  "yamlordereddictloader",
  "sphinx<8.2",
  "nbsphinx<0.9.8",
  "sphinx-autodoc-typehints<3.5.3",
  "sphinx_rtd_theme<3.0.3",
  "readthedocs-sphinx-ext<2.2.6",
  "recommonmark<0.7.2",
]
scirpy = ["scirpy<0.23.0", "awkward<2.8.11", "mudata<0.3.3"]
scrubet = ["scrublet<0.2.4", "annoy<1.17.0"]
palantir = ["palantir<1.4.3", "jax<0.8.2"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "dirty-tag"

[tool.hatch.build.targets.wheel]
only-packages = true
packages = ["src/dandelion"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"tigger-genotype" = "bin/tigger-genotype.R"
"MakeDb_gentle" = "bin/MakeDb_gentle.py"

[tool.hatch.build.hooks.vcs]
version-file = "_version.py"

[tool.hatch.build]
directory = "container/"
